<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="chilledBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B38"/>
      <stop offset="100%" stop-color="#081820"/>
    </linearGradient>
    <linearGradient id="milkGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2F1F8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CDE4F0"/>
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="chilledShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" rx="16" fill="url(#chilledBg)"/>

  <!-- Snowflake / Cold-Chain Trace Lines -->
  <g opacity="0.08" stroke="#BAE6FD" stroke-width="1.5" fill="none">
    <path d="M 60,60 L 90,60 M 75,45 L 75,75 M 65,50 L 85,70 M 65,70 L 85,50" />
    <path d="M 330,80 L 360,80 M 345,65 L 345,95 M 335,70 L 355,90 M 335,90 L 355,70" />
    <path d="M 200,20 L 200,50" stroke-dasharray="4 4"/>
  </g>

  <!-- Cold Slate Pad & Ground Shadow -->
  <ellipse cx="200" cy="190" rx="145" ry="30" fill="#000000" opacity="0.4"/>
  <ellipse cx="200" cy="182" rx="138" ry="26" fill="#1E2E38"/>
  <ellipse cx="200" cy="180" rx="134" ry="24" fill="#2A3D4A"/>

  <!-- Cold Insulated Tote / Dairy Container (Back) -->
  <g transform="translate(100, 110)" filter="url(#chilledShadow)">
    <rect x="0" y="20" width="85" height="60" rx="8" fill="#1E3A4D" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="10" y="30" width="65" height="18" rx="4" fill="#0E2330"/>
    <text x="42" y="43" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" text-anchor="middle">COLD TOTE</text>
  </g>

  <!-- Farm Milk Glass Bottle (Center) -->
  <g transform="translate(195, 90)" filter="url(#chilledShadow)">
    <!-- Shadow -->
    <ellipse cx="25" cy="98" rx="28" ry="10" fill="#000000" opacity="0.3"/>
    <!-- Bottle Body -->
    <path d="M 12,32 L 38,32 L 46,55 L 46,95 Q 46,102 25,102 Q 4,102 4,95 L 4,55 Z" fill="url(#milkGlass)"/>
    <!-- Bottle Neck -->
    <rect x="14" y="14" width="22" height="20" rx="2" fill="url(#milkGlass)"/>
    <!-- Bottle Cap (Forest Green) -->
    <rect x="11" y="8" width="28" height="8" rx="3" fill="#16865B"/>
    <!-- Milk Fill Level -->
    <path d="M 6,55 L 44,55 L 44,94 Q 44,100 25,100 Q 6,100 6,94 Z" fill="#FFFFFF"/>
    <!-- Farm Label -->
    <rect x="8" y="65" width="34" height="22" rx="3" fill="#E2F1F8" stroke="#16865B" stroke-width="0.8"/>
    <circle cx="25" cy="74" r="5" fill="#16865B"/>
    <text x="25" y="77" fill="#FFFFFF" font-family="sans-serif" font-size="7" font-weight="800" text-anchor="middle">M</text>
    <!-- Condensation Drops -->
    <ellipse cx="14" cy="62" rx="1.5" ry="3" fill="#BAE6FD" opacity="0.8"/>
    <ellipse cx="38" cy="88" rx="1.5" ry="2.5" fill="#BAE6FD" opacity="0.8"/>
    <ellipse cx="16" cy="90" rx="1.5" ry="2.5" fill="#BAE6FD" opacity="0.8"/>
  </g>

  <!-- Artisanal Cheese Wedge (Foreground Right) -->
  <g transform="translate(245, 142)" filter="url(#chilledShadow)">
    <!-- Wedge Geometry -->
    <polygon points="5,42 65,15 90,42" fill="url(#cheeseGrad)"/>
    <polygon points="5,42 90,42 85,55 5,55" fill="#D97706"/>
    <polygon points="90,42 65,15 65,28 85,55" fill="#B45309"/>
    <!-- Cheese Holes / Eyes -->
    <circle cx="35" cy="38" r="3.5" fill="#B45309"/>
    <circle cx="58" cy="34" r="4.5" fill="#B45309"/>
    <circle cx="74" cy="40" r="2.5" fill="#B45309"/>
    <circle cx="48" cy="24" r="3" fill="#92400E"/>
  </g>

  <!-- Fresh Yogurt Pot (Left) -->
  <g transform="translate(150, 145)" filter="url(#chilledShadow)">
    <ellipse cx="22" cy="38" rx="22" ry="8" fill="#000000" opacity="0.25"/>
    <path d="M 4,14 L 40,14 L 36,36 Q 36,40 22,40 Q 8,40 8,36 Z" fill="#FAF8F1"/>
    <!-- Foil Lid -->
    <ellipse cx="22" cy="14" rx="19" ry="5" fill="#38BDF8"/>
    <rect x="12" y="22" width="20" height="10" rx="2" fill="#DDEBDD"/>
  </g>

  <!-- Category Tag Pill -->
  <g transform="translate(24, 24)">
    <rect width="136" height="26" rx="13" fill="#0284C7" fill-opacity="0.9" stroke="#7DD3FC" stroke-width="1"/>
    <circle cx="13" cy="13" r="4" fill="#FAF8F1"/>
    <text x="24" y="17" fill="#FAF8F1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">DAIRY &amp; CHILLED</text>
  </g>

  <!-- Temperature Badge -->
  <g transform="translate(290, 24)">
    <rect width="86" height="26" rx="13" fill="#202B25" fill-opacity="0.8" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="43" y="17" fill="#7DD3FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">COLD • 3.4°C</text>
  </g>
</svg>

