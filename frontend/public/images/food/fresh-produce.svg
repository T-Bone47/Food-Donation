<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="produceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144632"/>
      <stop offset="100%" stop-color="#0A281C"/>
    </linearGradient>
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A67C52"/>
      <stop offset="50%" stop-color="#C29B6A"/>
      <stop offset="100%" stop-color="#8F6841"/>
    </linearGradient>
    <linearGradient id="appleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F"/>
      <stop offset="100%" stop-color="#B81D24"/>
    </linearGradient>
    <linearGradient id="carrotOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA133"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48BB78"/>
      <stop offset="100%" stop-color="#16865B"/>
    </linearGradient>
    <filter id="crateShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="260" rx="16" fill="url(#produceBg)"/>

  <!-- Subtle Vine Watermark -->
  <g opacity="0.06" stroke="#DDEBDD" stroke-width="1.5" fill="none">
    <path d="M 360,20 Q 300,80 240,60 T 140,80" />
    <path d="M 330,40 Q 310,60 300,50" />
    <circle cx="140" cy="80" r="5" fill="#DDEBDD"/>
  </g>

  <!-- Ground Drop Shadow -->
  <ellipse cx="200" cy="205" rx="150" ry="25" fill="#000000" opacity="0.38"/>

  <!-- Wooden Farm Crate Body -->
  <g filter="url(#crateShadow)">
    <!-- Rear Crate Slats -->
    <rect x="75" y="125" width="250" height="70" rx="6" fill="#6B4B29"/>
    
    <!-- Crisp Orchard Greenery / Kale / Spinach -->
    <!-- Left Leaf Cluster -->
    <path d="M 85,135 C 70,90 120,70 140,110 C 130,95 160,85 165,115 Z" fill="url(#leafGreen)"/>
    <path d="M 100,120 C 90,80 135,75 145,115 Z" fill="#2E8540"/>
    
    <!-- Right Leaf Cluster -->
    <path d="M 235,120 C 240,80 290,75 305,110 C 285,95 315,90 320,125 Z" fill="url(#leafGreen)"/>
    <path d="M 255,115 C 270,75 310,85 305,125 Z" fill="#2E8540"/>

    <!-- Fresh Harvest Heirloom Carrots -->
    <g transform="rotate(-25 155 130)">
      <polygon points="150,110 162,110 156,170" fill="url(#carrotOrange)"/>
      <!-- Carrot greens -->
      <path d="M 156,110 Q 150,90 145,80 M 156,110 Q 156,85 156,75 M 156,110 Q 162,90 168,82" stroke="#48BB78" stroke-width="2" fill="none"/>
    </g>
    <g transform="rotate(-10 180 135)">
      <polygon points="175,115 186,115 181,175" fill="url(#carrotOrange)"/>
      <path d="M 181,115 Q 175,95 170,85 M 181,115 Q 182,90 184,80" stroke="#48BB78" stroke-width="2" fill="none"/>
    </g>

    <!-- Crimson Farm Apples & Tomatoes -->
    <circle cx="215" cy="138" r="24" fill="url(#appleRed)"/>
    <!-- Apple highlight & stem -->
    <path d="M 215,114 Q 218,105 224,103" stroke="#5D3A1A" stroke-width="2.5" fill="none"/>
    <path d="M 217,112 Q 225,110 223,116 Z" fill="#48BB78"/>
    <ellipse cx="207" cy="128" rx="6" ry="10" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 207 128)"/>

    <!-- Golden Citrus / Lemon -->
    <ellipse cx="255" cy="144" rx="20" ry="17" fill="#F6C343"/>
    <circle cx="272" cy="144" r="3" fill="#DDAA48"/>
    <ellipse cx="249" cy="136" rx="4" ry="7" fill="#FFFFFF" opacity="0.35" transform="rotate(-20 249 136)"/>

    <!-- Front Wooden Slats -->
    <rect x="70" y="145" width="260" height="18" rx="3" fill="url(#crateWood)"/>
    <rect x="70" y="167" width="260" height="18" rx="3" fill="url(#crateWood)"/>
    <rect x="70" y="189" width="260" height="18" rx="3" fill="url(#crateWood)"/>
    
    <!-- Crate Side Posts -->
    <rect x="70" y="140" width="14" height="70" rx="2" fill="#7D5832"/>
    <rect x="316" y="140" width="14" height="70" rx="2" fill="#7D5832"/>
    <!-- Nails -->
    <circle cx="77" cy="154" r="2" fill="#3D2B19"/>
    <circle cx="77" cy="176" r="2" fill="#3D2B19"/>
    <circle cx="77" cy="198" r="2" fill="#3D2B19"/>
    <circle cx="323" cy="154" r="2" fill="#3D2B19"/>
    <circle cx="323" cy="176" r="2" fill="#3D2B19"/>
    <circle cx="323" cy="198" r="2" fill="#3D2B19"/>
  </g>

  <!-- Category Tag Pill -->
  <g transform="translate(24, 24)">
    <rect width="122" height="26" rx="13" fill="#16865B" fill-opacity="0.9" stroke="#34D399" stroke-width="1"/>
    <circle cx="13" cy="13" r="4" fill="#FAF8F1"/>
    <text x="24" y="17" fill="#FAF8F1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">FRESH PRODUCE</text>
  </g>

  <!-- Grade Badge -->
  <g transform="translate(286, 24)">
    <rect width="90" height="26" rx="13" fill="#202B25" fill-opacity="0.8" stroke="#DDEBDD" stroke-width="0.8"/>
    <text x="45" y="17" fill="#DDEBDD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">CRISP • GRADE A</text>
  </g>
</svg>

