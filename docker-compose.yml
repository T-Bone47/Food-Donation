# ==============================================================================
# FoodShare Unified Platform — Multi-Container Orchestration
# Docker Compose specification for production-parity deployment
# ==============================================================================

services:
  # 1. Express API Microservice (Backend, SSE Realtime Hub, Demo State Machine)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foodshare-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL:-https://placeholder-project.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder-key}
      - SESSION_SECRET=${SESSION_SECRET:-foodshare-development-session-secret-key-32-chars-minimum}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - EXPIRY_SWEEPER=false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - foodshare-net

  # 2. Flask Chatbot Microservice (Domain Knowledge, Grounded Fallback, Gemini)
  chatbot:
    build:
      context: ./chatbot_api
      dockerfile: Dockerfile
    container_name: foodshare-chatbot
    ports:
      - "5002:5002"
    environment:
      - FLASK_ENV=production
      - PORT=5002
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - BACKEND_API_URL=http://backend:5000/api/v1
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5002/health').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - foodshare-net

  # 3. Next.js Presentation Web Application (Standalone SSR, Realtime SSE Client)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: foodshare-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      - NEXT_PUBLIC_CHATBOT_URL=${NEXT_PUBLIC_CHATBOT_URL:-http://localhost:5002}
    depends_on:
      backend:
        condition: service_healthy
      chatbot:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - foodshare-net

networks:
  foodshare-net:
    driver: bridge

